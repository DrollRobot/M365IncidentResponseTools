# .github/workflows/ci.yml

name: CI
run-name: CI on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        shell: pwsh
        env:
          DETECT_SECRETS_VERSION: 1.5.0
        run: |
          pip install "detect-secrets==$env:DETECT_SECRETS_VERSION"
          detect-secrets-hook --baseline .secrets.baseline @(git ls-files)

      - name: Install PowerShell modules
        shell: pwsh
        run: Install-Module Pester, PSScriptAnalyzer, ModuleBuilder -Force -Scope CurrentUser -SkipPublisherCheck

      # Importing the module runs Confirm-Dependency.ps1, which aborts the import when
      # any module in RequiredModules.psd1 is missing. Tests.ps1 imports it for every step.
      # Skipped in a child that declined the dependency scripts.
      - name: Install module dependencies
        if: hashFiles('Source/ScriptsToProcess/Install-Dependency.ps1') != ''
        shell: pwsh
        run: .\Source\ScriptsToProcess\Install-Dependency.ps1 -Force

      - name: Lint checks
        shell: pwsh
        run: >
          .\Tests.ps1 ModuleSyntax,Lint -Quiet

      - name: PSScriptAnalyzer
        shell: pwsh
        run: .\Tests.ps1 PSSA -Quiet

      - name: NotLive Pester tests
        shell: pwsh
        run: .\Tests.ps1 NotLive
