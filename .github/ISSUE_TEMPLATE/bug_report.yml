# .github/ISSUE_TEMPLATE/bug_report.yml

name: Bug report
description: Something is not working as documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this report. Please search
        existing issues before opening a new one.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I call <Verb-Noun> with ... it throws ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal command sequence that reproduces the issue.
      render: powershell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: M365IncidentResponseTools version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: powershell-version
    attributes:
      label: PowerShell version ($PSVersionTable.PSVersion)
      placeholder: "7.5.0"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, error records, or anything else relevant.
